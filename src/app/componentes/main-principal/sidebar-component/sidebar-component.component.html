<p-drawer
  #drawerRef
  [visible]="(visible$ | async) ?? false"
  (visibleChange)="sidebarService.setVisible($event)"
  position="left"
  styleClass="w-64 sidebar-drawer"
  class="sidebarclass"
>
  <ng-template #headless>
    <!-- WRAPPER con fondo completo — evita que PrimeNG tape el background -->
    <div class="sidebar-wrapper">

      <!-- ══ HEADER / LOGO ══ -->
      <div class="sidebar-header">
        <div class="logo-glow-ring">
          <img
            src="../../../../assets/logo_az.png"
            alt="Logo"
            class="sidebar-logo"
            (click)="irPrincipal()"
          />
        </div>
        <div class="sidebar-brand-line"></div>
      </div>

      <!-- ══ MENÚ ══ -->
      <div class="sidebar-scroll-area">
        <ng-container *ngIf="menus$ | async as menus">
          <ng-template #renderItems let-items>
            <ul class="menu-list">
              <li *ngFor="let item of items" class="menu-item-wrapper">

                <!-- Ítem sin hijos -->
                <a
                  pRipple
                  class="menu-link"
                  [routerLink]="item.path"
                  *ngIf="!item.children?.length; else hasChildren"
                >
                  <span class="menu-icon-wrap">
                    <i class="{{ item.icon }} menu-icon"></i>
                  </span>
                  <span class="menu-label">{{ item.name }}</span>
                  <span class="menu-active-dot"></span>
                </a>

                <!-- Acordeón con hijos -->
                <ng-template #hasChildren>
                  <div
                    pRipple
                    class="menu-link menu-link--accordion"
                    (click)="item.expanded = !item.expanded"
                  >
                    <span class="menu-icon-wrap">
                      <i class="{{ item.icon }} menu-icon"></i>
                    </span>
                    <span class="menu-label">{{ item.name }}</span>
                    <i
                      class="pi menu-chevron"
                      [ngClass]="{
                        'pi-chevron-down': !item.expanded,
                        'pi-chevron-up': item.expanded,
                        'menu-chevron--open': item.expanded
                      }"
                    ></i>
                  </div>

                  <!-- Sub-menú -->
                  <div *ngIf="item.expanded" class="submenu-container">
                    <ng-container
                      *ngTemplateOutlet="renderItems; context:{ $implicit: item.children }"
                    ></ng-container>
                  </div>
                </ng-template>

              </li>
            </ul>
          </ng-template>

          <!-- Primera llamada -->
          <ng-container *ngTemplateOutlet="renderItems; context:{ $implicit: menus }">
          </ng-container>
        </ng-container>
      </div>

      <!-- ══ FOOTER ══ -->
      <div class="sidebar-footer">
        <div class="footer-divider"></div>
        <p class="footer-text">© 2025 AZGROUP</p>
        <p class="footer-sub">Todos los derechos reservados</p>
      </div>

    </div><!-- /sidebar-wrapper -->
  </ng-template>
</p-drawer>
