<!-- Quita el div contenedor exterior y deja solo el header -->
<header class="headerclass shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <p-button icon="pi pi-bars" (click)="sidebarService.toggle()" styleClass="p-button-text p-button-plain text-white">
        </p-button>
        <!-- Nombre de la empresa -->
        <div class="text-2xl font-bold text-white font-[Montserrat]">
            AZGROUP
        </div>
        <!-- Ícono de avatar -->
        <div class="flex items-center gap-4">
            <div *ngIf="esUsuarioJhon()" class="flex items-center gap-1.5 bg-white/10 p-1 rounded border border-white/20">
                <span class="text-white text-[10px] font-semibold uppercase tracking-wider pl-1">Formato:</span>
                <p-select [options]="opcionesFormato" [(ngModel)]="formatService.formatoSeleccionado" 
                          optionLabel="label" optionValue="value" 
                          styleClass="w-36 p-button-sm !text-xs !py-0.5"
                          class="w-36 text-xs shadow-sm">
                </p-select>
            </div>
            <p-avatar icon="pi pi-user" [label]="userInitial" class="cursor-pointer" shape="circle"
                (click)="toggle($event)" />
        </div>
    </div>
</header>

<p-popover #op>
    <button (click)="logout()">Cerrar sesión</button>
</p-popover>
