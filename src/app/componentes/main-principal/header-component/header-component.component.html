<!-- Quita el div contenedor exterior y deja solo el header -->
<header class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <p-button icon="pi pi-bars" (click)="sidebarService.toggle()" styleClass="p-button-text p-button-plain">
        </p-button>
        <!-- Nombre de la empresa -->
        <div class="text-2xl font-bold text-blue-600">
            AZGROUP
        </div>
        <!-- Ícono de avatar -->
        <div class="flex items-center">
            <p-avatar icon="pi pi-user" [label]="userInitial" class="mr-2 cursor-pointer" shape="circle"
                (click)="toggle($event)" />
        </div>
    </div>
</header>

<p-popover #op>
    <button (click)="logout()">Cerrar sesión</button>
</p-popover>
