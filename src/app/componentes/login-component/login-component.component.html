<div class="login-wrapper-light">
  <div class="split-container">

    <div class="info-panel">
      <div class="info-content">
        <h2>Bienvenido a AZGROUP</h2>
        <p>Tu socio estratégico en gestión empresarial inteligente.</p>
      </div>
    </div>

    <div class="form-panel">
      <div class="login-card-light">
        <div class="text-center mb-8">
          <div class="brand-logo-light">AZ</div>
          <h1 class="brand-title">AZGROUP</h1>
          <p class="brand-subtitle">Sistema de Gestión Empresarial</p>
        </div>

        <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
          <div class="form-group-light">
            <label for="username" class="form-label">Usuario</label>
            <div class="input-wrapper">
              <i class="input-icon pi pi-user"></i>
              <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Tu nombre de usuario"
                required class="form-input-light" />
            </div>
          </div>

          <div class="form-group-light mb-6">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-wrapper">
              <i class="input-icon pi pi-lock"></i>
              <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••"
                required class="form-input-light" />
            </div>
          </div>

          <button type="submit" [disabled]="loginForm.invalid" class="btn-login-light">
            Ingresar
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
