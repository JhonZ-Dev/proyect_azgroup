<div class="login-wrapper">

  <!-- ─── LADO IZQUIERDO: branding decorativo ─────────────────────────── -->
  <div class="login-left">
    <div class="dots-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="brand-block">
      <div class="brand-logo">AZ</div>
      <div class="brand-name">AZGROUP</div>
      <div class="brand-tagline">Sistema de Gestión Empresarial</div>
    </div>
  </div>

  <!-- ─── LADO DERECHO: formulario ───────────────────────────────────── -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <h1>Bienvenido</h1>
        <p>Inicia sesión para continuar</p>
      </div>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

        <!-- Usuario -->
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <span class="input-icon pi pi-user"></span>
            <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Tu nombre de usuario"
              required class="form-input" />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon pi pi-lock"></span>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required
              class="form-input" />
          </div>
        </div>

        <!-- Botón -->
        <button type="submit" [disabled]="loginForm.invalid" class="btn-login">
          Ingresar
        </button>

      </form>
    </div>
  </div>

</div>
